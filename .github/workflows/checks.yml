name: checks
# Calls practice-library/.github's reusable workflows at one pinned commit. The gate's needs must
# equal the jobs in .github/required-checks.json.
# discover and schema-check join when this repository has a check.json to validate.
on:
  pull_request:
    branches: [main]
    # labeled and unlabeled re-run schema-loosening when a maintainer adds or removes its label.
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  unit:
    name: unit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install requirements.txt, pinned by hash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/python" -m pip install --require-hashes --only-binary :all: -r requirements.txt
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
      - name: The runtime's unit tests
        run: python3 -m unittest discover -s tests -t . -v
      - name: Each guard, removed, makes its test fail
        run: python3 tests/guards.py

  conformance:
    name: conformance
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      # practice-library/machinery at the merge of #30: the Connect runner, its fixtures' format and the contract
      MACHINERY_COMMIT: d60246522d7390c850d2e821d7bfb08a959ff2c2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: practice-library/machinery
          ref: ${{ env.MACHINERY_COMMIT }}
          path: machinery
          persist-credentials: false
      - name: Install requirements.txt, pinned by hash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/python" -m pip install --require-hashes --only-binary :all: -r requirements.txt
      - name: Fetch jsonschema 17.2.1, pinned by sha256
        env:
          TOOL_URL: https://github.com/sourcemeta/jsonschema/releases/download/v17.2.1/jsonschema-17.2.1-linux-x86_64.zip
          TOOL_SHA256: 9ffee3cfbe0fe1343d9d36bcce9e6036ec4d73e4b29f656c039fca6118da2f35
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 "$TOOL_URL" -o "$RUNNER_TEMP/jsonschema.zip"
          echo "$TOOL_SHA256  $RUNNER_TEMP/jsonschema.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/jsonschema.zip" -d "$RUNNER_TEMP/jsonschema"
          echo "$RUNNER_TEMP/jsonschema/jsonschema-17.2.1-linux-x86_64/bin" >> "$GITHUB_PATH"
      - name: The minimal example, served by the runtime, passes the runtime's fixtures with machinery's Connect runner
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/venv/bin/python" -I examples/minimal.py > "$RUNNER_TEMP/server.url" &
          trap 'kill %1' EXIT
          for _ in $(seq 100); do [ -s "$RUNNER_TEMP/server.url" ] && break; sleep 0.1; done
          python3 machinery/conformance/connect_run.py --url "$(head -1 "$RUNNER_TEMP/server.url")" \
            --report-schema machinery/tests/fixtures/graphs/spec/refresh-report/schema.json \
            --validator jsonschema --fixtures conformance/fixtures

  leak-scan:
    uses: practice-library/.github/.github/workflows/leak-scan.yml@1dd90884cca4277db278eb7d4ea17eaebf21e563 # v2.1.0
  denylist:
    permissions:
      contents: read
      pull-requests: read
    uses: practice-library/.github/.github/workflows/guard.yml@1dd90884cca4277db278eb7d4ea17eaebf21e563 # v2.1.0
    with:
      guard: denylist
  removed-paths:
    permissions:
      contents: read
      pull-requests: read
    uses: practice-library/.github/.github/workflows/guard.yml@1dd90884cca4277db278eb7d4ea17eaebf21e563 # v2.1.0
    with:
      guard: removed-paths
  release-note:
    permissions:
      contents: read
      pull-requests: read
    uses: practice-library/.github/.github/workflows/guard.yml@1dd90884cca4277db278eb7d4ea17eaebf21e563 # v2.1.0
    with:
      guard: release-note
  schema-loosening:
    permissions:
      contents: read
      pull-requests: read
    uses: practice-library/.github/.github/workflows/guard.yml@1dd90884cca4277db278eb7d4ea17eaebf21e563 # v2.1.0
    with:
      guard: schema-loosening
  gate:
    if: always()
    needs: [unit, conformance, leak-scan, denylist, removed-paths, release-note, schema-loosening]
    uses: practice-library/.github/.github/workflows/gate.yml@1dd90884cca4277db278eb7d4ea17eaebf21e563 # v2.1.0
    with:
      needs: ${{ toJSON(needs) }}
