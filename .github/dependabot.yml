# Copy to .github/dependabot.yml in a repository that calls practice-library/.github's workflows.
# Dependabot then proposes new pins for the reusable workflows and actions it uses, and for the
# hash-pinned requirements.txt (machinery-gen is pinned by URL and is bumped by hand).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
